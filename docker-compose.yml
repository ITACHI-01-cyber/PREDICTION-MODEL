version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: govproject-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: govproject_risk_analytics
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  model-service:
    build:
      context: ./model
      dockerfile: Dockerfile
    container_name: govproject-model
    ports:
      - "8000:8000"
    volumes:
      - ./model/models:/app/models:ro
    environment:
      MODEL_PATH: /app/models/sih_cost_prediction_model.pkl
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 3
    depends_on:
      mongodb:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: govproject-backend
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/govproject_risk_analytics
      MODEL_SERVICE_URL: http://model-service:8000
      JWT_SECRET: ${JWT_SECRET:-changeThisToASecureRandomStringInProduction256Bits}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
      model-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: govproject-frontend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  mongodb_data:

